spring:
  application:
    name: Cash Store Application
  datasource:
    url: jdbc:sqlite:cash_store.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite — однопользовательская база с одним писателем; отдельный пул соединений
      # только создаёт риск "database is locked" при конкурентных запросах.
      maximum-pool-size: 1
  main:
    web-application-type: none

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # SQLite не имеет отдельных SQL-типов INTEGER/BIGINT — только "type affinity", поэтому
      # ddl-auto: validate падает на любом Long-поле ("found INTEGER, but expecting BIGINT"),
      # хотя схема корректна. Источник истины — Flyway-миграции; их правильность проверяет
      # SqliteSchemaIntegrationTest реальными операциями с БД, а не сверкой типов колонок.
      ddl-auto: none
    show-sql: true

logging:
  file:
    name: logs/cash-app.log
  charset:
    console: UTF-8
  logback:
    rollingpolicy:
      max-file-size: 80MB
      total-size-cap: 200MB
      max-history: 1
      file-name-pattern: logs/cash-app.%d{yyyy-MM-dd}-%i.log
#  level:
#    org.hibernate.SQL: DEBUG            # сами SQL
#    org.hibernate.orm.jdbc.bind: TRACE  # значения параметров (binding)
#    org.hibernate.orm.jdbc.extract: TRACE  # (опц.) извлечение из ResultSet

app:
  http:
    enable-timeout: true   # отключить таймауты -> false
    connect-timeout: 10s
    read-timeout: 30s
  product:
    universal-product-barcode: universal-product-200001
    product-return-period: 14

